name: Deploy Live Web PWA to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production PWA Frontend
        env:
          GITHUB_PAGES: "true"
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Built Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinPharm-Web-PWA-Build
          path: ./dist

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
        continue-on-error: true

      - name: Configure GitHub Pages (Actions Mode)
        id: pages_config
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages Artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: steps.pages_config.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
