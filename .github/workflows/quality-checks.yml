name: Security and Clinical Quality Checks

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript and lint checks
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Production web build (without client secrets)
        env:
          GITHUB_PAGES: "true"
        run: npm run build
